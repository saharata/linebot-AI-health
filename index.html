<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCIjzzeoKkNJQVxgBrKiJCix_q9DYpmxW0loXFfg4FMCiGgjaH39KST2m8A-aNCmOz/exec";

  function getUserIdSmart() {
    const params = new URLSearchParams(window.location.search);

    const fromUserId = (params.get("userId") || "").trim();
    const fromUid = (params.get("uid") || "").trim();
    const fromStorage = (localStorage.getItem("lineUserId") || "").trim();

    const finalUserId = fromUserId || fromUid || fromStorage || "";

    if (finalUserId) {
      localStorage.setItem("lineUserId", finalUserId);
    }

    return finalUserId;
  }

  function formatDateThai(dateStr) {
    if (!dateStr) return "-";
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  function formatTsShort(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    if (isNaN(d)) return ts;
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return `${dd}/${mm}`;
  }

  function migraineText(v) {
    if (v === 1) return "ระดับ 1 (เล็กน้อย)";
    if (v === 2) return "ระดับ 2 (ปานกลาง)";
    if (v === 3) return "ระดับ 3 (มาก)";
    if (v === null || v === undefined || v === "") return "-";
    return `ระดับ ${v}`;
  }

  function setText(id, value) {
    document.getElementById(id).textContent = value ?? "-";
  }

  function destroyIfExists(chartObj) {
    if (chartObj && typeof chartObj.destroy === "function") {
      chartObj.destroy();
    }
  }

  let bpChartObj = null;
  let weightChartObj = null;
  let bmiChartObj = null;
  let sugarChartObj = null;
  let kidneyChartObj = null;

  function buildLineChart(canvasId, emptyId, labels, datasets) {
    const canvas = document.getElementById(canvasId);
    const empty = document.getElementById(emptyId);

    const hasData = datasets.some(ds => Array.isArray(ds.data) && ds.data.some(v => v !== null && v !== undefined));
    if (!hasData || labels.length === 0) {
      canvas.style.display = "none";
      empty.style.display = "block";
      return null;
    }

    canvas.style.display = "block";
    empty.style.display = "none";

    return new Chart(canvas, {
      type: "line",
      data: {
        labels,
        datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        interaction: {
          mode: "index",
          intersect: false
        },
        scales: {
          y: {
            beginAtZero: false
          }
        }
      }
    });
  }

  function normalizeTrendLabels(arr) {
    return (arr || []).map(x => formatTsShort(x.timestamp));
  }

  function normalizeTrendValues(arr) {
    return (arr || []).map(x => x.value ?? null);
  }

  function renderSummary(summary) {
    const box = document.getElementById("summaryBox");
    if (!Array.isArray(summary) || summary.length === 0) {
      box.innerHTML = "ยังไม่มีข้อมูลพอสำหรับสรุป";
      return;
    }

    box.innerHTML = `<ul>${summary.map(x => `<li>${x}</li>`).join("")}</ul>`;
  }

  function renderAppointment(appointment) {
    if (!appointment || !appointment.date) {
      document.getElementById("appointmentBox").textContent = "ยังไม่มีนัดครั้งถัดไปในระบบ";
      return;
    }

    let text = `วันที่ ${formatDateThai(appointment.date)}`;
    if (appointment.time) text += ` เวลา ${appointment.time} น.`;
    if (appointment.note) text += `\nหมายเหตุ: ${appointment.note}`;
    document.getElementById("appointmentBox").textContent = text;
  }

  async function loadDashboard() {
    const userId = getUserIdSmart();

    if (!userId) {
      document.getElementById("updatedAt").textContent = "ไม่พบ userId ใน URL หรือ localStorage";
      return;
    }

    const url = `${APPS_SCRIPT_URL}?mode=dashboard&userId=${encodeURIComponent(userId)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.ok || !data.found) {
      document.getElementById("updatedAt").textContent = "ไม่พบข้อมูลผู้ป่วย";
      return;
    }

    const profile = data.profile || {};
    const latest = data.latest || {};
    const labs = data.labs || {};
    const appointment = data.appointment || {};
    const trends = data.trends || {};
    const summary = data.aiSummaryDraft || [];

    setText("updatedAt", `อัปเดตล่าสุด: ${data.updatedAt || "-"}`);
    setText("chipName", `ชื่อ: ${profile.fullName || profile.lineDisplayName || "-"}`);
    setText("chipHN", `HN: ${profile.hn || "-"}`);

    setText("weightValue", latest.weight != null ? `${latest.weight} kg` : "-");
    setText("bmiValue", latest.bmi != null ? latest.bmi : "-");
    setText("bpValue", (latest.systolic != null && latest.diastolic != null) ? `${latest.systolic}/${latest.diastolic} mmHg` : "-");
    setText("migraineValue", migraineText(latest.migrainePain));
    setText("symptomsBox", latest.symptoms || "ไม่มีข้อมูล");

    setText("fbsValue", labs.fbs ?? "-");
    setText("hba1cValue", labs.hba1c ?? "-");
    setText("bunValue", labs.bun ?? "-");
    setText("creatinineValue", labs.creatinine ?? "-");
    setText("uricValue", labs.uric ?? "-");
    setText("ldlValue", labs.ldl ?? "-");

    renderSummary(summary);
    renderAppointment(appointment);

    destroyIfExists(bpChartObj);
    destroyIfExists(weightChartObj);
    destroyIfExists(bmiChartObj);
    destroyIfExists(sugarChartObj);
    destroyIfExists(kidneyChartObj);

    const bpLabels = normalizeTrendLabels(trends.systolic || []);
    bpChartObj = buildLineChart("bpChart", "bpChartEmpty", bpLabels, [
      {
        label: "Systolic",
        data: normalizeTrendValues(trends.systolic || []),
        tension: 0.3
      },
      {
        label: "Diastolic",
        data: normalizeTrendValues(trends.diastolic || []),
        tension: 0.3
      }
    ]);

    const weightLabels = normalizeTrendLabels(trends.weight || []);
    weightChartObj = buildLineChart("weightChart", "weightChartEmpty", weightLabels, [
      {
        label: "Weight",
        data: normalizeTrendValues(trends.weight || []),
        tension: 0.3
      }
    ]);

    const bmiLabels = normalizeTrendLabels(trends.bmi || []);
    bmiChartObj = buildLineChart("bmiChart", "bmiChartEmpty", bmiLabels, [
      {
        label: "BMI",
        data: normalizeTrendValues(trends.bmi || []),
        tension: 0.3
      }
    ]);

    const sugarLabels = normalizeTrendLabels((trends.fbs || []).length ? (trends.fbs || []) : (trends.hba1c || []));
    sugarChartObj = buildLineChart("sugarChart", "sugarChartEmpty", sugarLabels, [
      {
        label: "FBS",
        data: normalizeTrendValues(trends.fbs || []),
        tension: 0.3
      },
      {
        label: "HbA1c",
        data: normalizeTrendValues(trends.hba1c || []),
        tension: 0.3
      }
    ]);

    const kidneyLabels = normalizeTrendLabels(
      (trends.creatinine || []).length
        ? (trends.creatinine || [])
        : ((trends.bun || []).length ? (trends.bun || []) : (trends.uric || []))
    );

    kidneyChartObj = buildLineChart("kidneyChart", "kidneyChartEmpty", kidneyLabels, [
      {
        label: "Creatinine",
        data: normalizeTrendValues(trends.creatinine || []),
        tension: 0.3
      },
      {
        label: "BUN",
        data: normalizeTrendValues(trends.bun || []),
        tension: 0.3
      },
      {
        label: "Uric",
        data: normalizeTrendValues(trends.uric || []),
        tension: 0.3
      }
    ]);
  }

  loadDashboard().catch(err => {
    document.getElementById("updatedAt").textContent = "โหลดข้อมูลไม่สำเร็จ";
    console.error(err);
  });
</script>
