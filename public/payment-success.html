<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>จ่ายเงินสำเร็จ</title>
<style>
body { margin:0; font-family: -apple-system, "Sarabun", sans-serif; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.card { background:#fff; border-radius:18px; padding:32px; max-width:420px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.06); }
.tick { font-size:56px; color:#16a34a; margin-bottom:14px; }
h1 { font-size:20px; margin:0 0 10px; }
.msg { color:#475569; line-height:1.7; margin-bottom:20px; }
a { display:inline-block; padding:14px 24px; background:#4f46e5; color:#fff; text-decoration:none; border-radius:12px; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>จ่ายเงินสำเร็จ</h1>
  <div class="msg">
    ยืนยัน slot ของคุณเรียบร้อยแล้ว<br>
    คุณหมอจะ video call เข้ามาตามเวลาที่นัด<br>
    ระบบจะส่งลิงก์ผ่าน LINE ก่อนเวลา 5 นาที
  </div>
  <a href="https://line.me/R/">กลับไป LINE</a>
</div>
</body>
</html>
