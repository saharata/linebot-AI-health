<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <!-- Deep navy-black vertical gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="45%" stop-color="#0a1326"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <!-- EUV beam gradient (pale blue-white) -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff1ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#8fc8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a78c8" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#bfe2ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bfe2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softblur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bg)"/>

  <!-- Subtle floor reflection line -->
  <rect x="0" y="1300" width="1200" height="500" fill="#0c1830" opacity="0.5"/>

  <!-- Big machine silhouette (the "uncle") -->
  <g opacity="0.9">
    <rect x="360" y="780" width="480" height="640" rx="10" fill="#0e1b30"/>
    <rect x="360" y="780" width="480" height="40" fill="#13243f"/>
    <rect x="385" y="1080" width="430" height="6" fill="#0a1526"/>
    <rect x="385" y="1230" width="430" height="6" fill="#0a1526"/>
    <!-- base blue accent LEDs -->
    <rect x="380" y="1400" width="440" height="8" fill="#3fa9ff" opacity="0.8" filter="url(#softblur)"/>
    <circle cx="420" cy="1404" r="5" fill="#7fd0ff"/>
    <circle cx="470" cy="1404" r="5" fill="#7fd0ff"/>
    <circle cx="520" cy="1404" r="5" fill="#7fd0ff"/>
  </g>

  <!-- Central EUV beam from top -->
  <polygon points="560,0 640,0 700,820 500,820" fill="url(#beam)" filter="url(#blur)"/>
  <rect x="592" y="0" width="16" height="820" fill="#eaf6ff" opacity="0.85" filter="url(#softblur)"/>
  <ellipse cx="600" cy="700" rx="320" ry="240" fill="url(#glow)"/>

  <!-- Lone figure in clean-room suit (small, facing the machine) -->
  <g transform="translate(600,1300)">
    <!-- shadow -->
    <ellipse cx="0" cy="120" rx="60" ry="14" fill="#000" opacity="0.4"/>
    <!-- body (yellow suit, dim) -->
    <path d="M -28 -10 Q -34 60 -26 120 L 26 120 Q 34 60 28 -10 Q 20 -30 0 -34 Q -20 -30 -28 -10 Z" fill="#caa23a" opacity="0.92"/>
    <path d="M -28 -10 Q -34 60 -26 120 L 0 120 L 0 -34 Q -20 -30 -28 -10 Z" fill="#9c7d2b" opacity="0.7"/>
    <!-- hood/head -->
    <circle cx="0" cy="-48" r="22" fill="#d8b24a"/>
    <circle cx="0" cy="-50" r="14" fill="#1a1408" opacity="0.55"/>
  </g>

  <!-- Title block -->
  <g text-anchor="middle" font-family="'Noto Serif', 'Sarabun', serif">
    <text x="600" y="250" fill="#f4f9ff" font-size="92" font-weight="700" letter-spacing="2">แสงที่ความยาวคลื่น</text>
    <text x="600" y="360" fill="#f4f9ff" font-size="92" font-weight="700" letter-spacing="2">สิบสามจุดห้า</text>
    <line x1="430" y1="410" x2="770" y2="410" stroke="#7fb6ff" stroke-width="2" opacity="0.7"/>
    <text x="600" y="468" fill="#9fc4ee" font-size="34" letter-spacing="1">สิบห้าปีของวิศวกรหญิงคนหนึ่ง</text>
    <text x="600" y="514" fill="#9fc4ee" font-size="34" letter-spacing="1">ในสงครามที่ทำด้วยแสง</text>
  </g>

  <!-- Author -->
  <text x="600" y="1660" text-anchor="middle" fill="#dfeaf7" font-family="'Sarabun', sans-serif" font-size="40" letter-spacing="3">[ นามปากกา ]</text>

  <!-- English subtitle small -->
  <text x="600" y="1730" text-anchor="middle" fill="#5f7da6" font-family="serif" font-size="26" letter-spacing="4">THE WAVELENGTH OF 13.5</text>
</svg>
